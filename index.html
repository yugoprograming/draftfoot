<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PLAYER DRAFT</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0b0b0d;
      color: white;
      font-family: Arial, sans-serif;
    }

    .screen {
      display: none;
      min-height: 100vh;
      padding: 60px 20px;
    }

    .active {
      display: block;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      text-align: center;
    }

    h1 {
      font-size: 48px;
      letter-spacing: 5px;
      margin-bottom: 50px;
    }

    h2 {
      font-size: 30px;
      margin-bottom: 40px;
    }

    button {
      display: block;
      width: 100%;
      padding: 18px;
      margin: 15px 0;
      border: none;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .primary {
      background: white;
      color: black;
    }

    .dark {
      background: #222;
      color: white;
      border: 1px solid #555;
    }

    .back {
      margin-top: 30px;
      background: transparent;
      color: #aaa;
    }

    .option-group {
      margin: 30px 0;
    }

    .option-group p {
      color: #aaa;
      margin-bottom: 15px;
    }

    .options {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .option {
      background: #1c1c20;
      border: 1px solid #444;
      color: white;
      margin: 0;
    }

    .option.selected {
      background: white;
      color: black;
    }

    input {
      width: 100%;
      padding: 17px;
      background: #18181b;
      color: white;
      border: 1px solid #444;
      border-radius: 8px;
      font-size: 18px;
      margin-bottom: 20px;
    }

    #message {
      margin-top: 25px;
      color: #aaa;
    }
  </style>
</head>

<body>

  <!-- HOME -->
  <section id="home" class="screen active">
    <div class="container">
      <h1>PLAYER DRAFT</h1>

      <button class="primary" onclick="showCreate()">
        ドラフト会議を開催
      </button>

      <button class="dark" onclick="showJoin()">
        ドラフト会議に参加
      </button>
    </div>
  </section>


  <!-- CREATE ROOM -->
  <section id="create" class="screen">
    <div class="container">

      <h2>ドラフト会議を開催</h2>

      <input
        id="hostName"
        type="text"
        placeholder="あなたの名前"
      >

      <div class="option-group">
        <p>参加人数</p>

        <div class="options">
          <button class="option" onclick="selectPlayers(2)">2人</button>
          <button class="option" onclick="selectPlayers(3)">3人</button>
          <button class="option" onclick="selectPlayers(4)">4人</button>
          <button class="option" onclick="selectPlayers(5)">5人</button>
          <button class="option" onclick="selectPlayers(6)">6人</button>
          <button class="option" onclick="selectPlayers(10)">10人</button>
        </div>
      </div>


      <div class="option-group">
        <p>ラウンド数</p>

        <div class="options">
          <button class="option" onclick="selectRounds(3)">3</button>
          <button class="option" onclick="selectRounds(5)">5</button>
          <button class="option" onclick="selectRounds(8)">8</button>
          <button class="option" onclick="selectRounds(10)">10</button>
        </div>
      </div>


      <button class="primary" onclick="createRoom()">
        部屋を作る
      </button>

      <button class="back" onclick="goHome()">
        ← 戻る
      </button>

      <div id="message"></div>

    </div>
  </section>


  <!-- JOIN ROOM -->
  <section id="join" class="screen">
    <div class="container">

      <h2>ドラフト会議に参加</h2>

      <input
        id="joinName"
        type="text"
        placeholder="あなたの名前"
      >

      <input
        id="roomCode"
        type="text"
        placeholder="ルームコード"
      >

      <button class="primary" onclick="joinRoom()">
        参加する
      </button>

      <button class="back" onclick="goHome()">
        ← 戻る
      </button>

      <div id="joinMessage"></div>

    </div>
  </section>


  <script>

    let playerCount = 0;
    let roundCount = 0;


    function showScreen(id) {
      document.querySelectorAll(".screen").forEach(screen => {
        screen.classList.remove("active");
      });

      document.getElementById(id).classList.add("active");
    }


    function goHome() {
      showScreen("home");
    }


    function showCreate() {
      showScreen("create");
    }


    function showJoin() {
      showScreen("join");
    }


    function selectPlayers(count) {
      playerCount = count;

      document.querySelectorAll("#create .option").forEach(button => {
        button.classList.remove("selected");
      });

      event.target.classList.add("selected");
    }


    function selectRounds(count) {
      roundCount = count;

      const buttons = document.querySelectorAll(
        "#create .option-group:nth-of-type(2) .option"
      );

      buttons.forEach(button => {
        button.classList.remove("selected");
      });

      event.target.classList.add("selected");
    }


    function createRoom() {

      const name = document.getElementById("hostName").value.trim();

      if (!name) {
        document.getElementById("message").textContent =
          "名前を入力してください";
        return;
      }

      if (!playerCount) {
        document.getElementById("message").textContent =
          "参加人数を選んでください";
        return;
      }

      if (!roundCount) {
        document.getElementById("message").textContent =
          "ラウンド数を選んでください";
        return;
      }

      document.getElementById("message").textContent =
        `準備完了！ ${playerCount}人・${roundCount}ラウンド`;
    }


    function joinRoom() {

      const name = document.getElementById("joinName").value.trim();
      const code = document.getElementById("roomCode").value.trim();

      if (!name || !code) {
        document.getElementById("joinMessage").textContent =
          "名前とルームコードを入力してください";
        return;
      }

      document.getElementById("joinMessage").textContent =
        "参加準備完了！";
    }

  </script>

</body>
</html>
