<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Premier Player Draft</title>
<style>
:root{--bg:#07111f;--card:#0e1b2d;--line:#29415f;--text:#f5f7fb;--muted:#9fb0c4;--green:#3ee58f;--gold:#ffd166}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#07111f,#0b1829,#07111f);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}.wrap{width:min(900px,100%);margin:auto;padding:18px 14px 50px}.top{display:flex;justify-content:space-between;align-items:center}.logo{font-weight:900;letter-spacing:.04em}.live{font-size:11px;color:var(--green);border:1px solid #245c47;border-radius:99px;padding:5px 9px}.hero{padding:38px 0 24px}.eyebrow{color:var(--green);font-size:12px;font-weight:800;letter-spacing:.15em}.hero h1{font-size:clamp(42px,12vw,76px);line-height:.9;margin:14px 0}.hero p{color:var(--muted);line-height:1.6}.card{background:#0e1b2df2;border:1px solid var(--line);border-radius:18px;padding:18px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;background:#081524;color:var(--text);outline:none}.field:focus{border-color:var(--green)}label{display:block;color:var(--muted);font-size:12px;margin:0 0 7px}.btn{border:0;border-radius:12px;padding:13px 16px;background:var(--green);color:#04130b;font-weight:900;cursor:pointer}.btn.secondary{background:#15263b;color:var(--text);border:1px solid var(--line)}.actions{display:flex;gap:10px;margin-top:14px}.room{font-size:28px;font-weight:900;letter-spacing:.14em}.hidden{display:none}.status{display:flex;justify-content:space-between;padding:10px;border:1px solid var(--line);border-radius:12px;margin-top:8px;background:#081524}.playerboard{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.player{border:1px solid var(--line);border-radius:14px;padding:13px;background:#081524}.small{font-size:12px;color:var(--muted)}.pick{font-size:18px;font-weight:800;margin-top:8px}.reveal{font-size:24px;font-weight:900;text-align:center;color:var(--gold)}@media(max-width:600px){.grid{grid-template-columns:1fr}.actions{display:grid;grid-template-columns:1fr}.hero{padding-top:28px}.card{padding:15px}}
</style></head>
<body><main class="wrap">
<header class="top"><div class="logo">⚽ PREMIER DRAFT</div><div class="live">LIVE</div></header>
<section id="home"><div class="hero"><div class="eyebrow">PLAYER DRAFT · 2–10 PLAYERS</div><h1>Pick.<br>Lock.<br>Reveal.</h1><p>選手名は自由入力。全員がLOCKするまで秘密。全員LOCKした瞬間、全員の指名を同時公開。</p></div>
<div class="card"><div class="grid"><div><label>あなたの名前</label><input id="name" class="field" placeholder="Yugo"></div><div><label>人数</label><select id="count" class="field"><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option></select></div></div><div class="grid" style="margin-top:12px"><div><label>ラウンド数</label><input id="rounds" class="field" type="number" min="1" max="30" value="5"></div><div><label>ドラフト方式</label><div class="field" style="color:var(--muted)">Snake Draft</div></div></div><div class="actions"><button class="btn" onclick="alert('次のステップでSupabaseと接続してルーム作成を実装します。')">CREATE ROOM</button></div></div>
<div class="card"><label>友達からもらったルームコード</label><input class="field" placeholder="ABC123"><div class="actions"><button class="btn secondary" onclick="alert('次のステップでJOIN ROOMを実装します。')">JOIN ROOM</button></div></div></section>
<section class="card hidden" id="draft"><div class="small">ROUND 1 / 5</div><h2>Your Pick</h2><input class="field" placeholder="Mohamed Salah"><div class="actions"><button class="btn">🔒 LOCK PICK</button></div><div class="status"><span>You</span><b>LOCKED</b></div><div class="status"><span>Friend</span><b>WAITING</b></div></section>
</main></body></html>
