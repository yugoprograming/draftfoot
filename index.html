<script>

/* ==================================================
   SUPABASE
================================================== */

const SUPABASE_URL =
  "https://bxrxrfcntuargpnfodel.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_c5y87pnYPQfLNLy76WE7gw_4QQodxin";

const db =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* ==================================================
   STATE
================================================== */

let roomCode = null;
let myParticipant = null;
let isHost = false;

let roomData = null;
let participants = [];

let currentRound = 1;
let poll = null;
let resolving = false;


/* ==================================================
   BASIC
================================================== */

function show(id){
  document.getElementById(id)
    .classList.remove("hidden");
}

function hide(id){
  document.getElementById(id)
    .classList.add("hidden");
}

function setMessage(text,type=""){
  const el =
    document.getElementById("homeMessage");

  el.className =
    "status " + type;

  el.textContent = text;
}

function escapeHTML(value){
  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


/* ==================================================
   ROOM CODE
================================================== */

function generateCode(){

  return Math.random()
    .toString(36)
    .substring(2,8)
    .toUpperCase();

}


/* ==================================================
   CREATE
================================================== */

async function createRoom(){

  const name =
    document.getElementById(
      "createName"
    ).value.trim();

  const count =
    Number(
      document.getElementById(
        "playerCount"
      ).value
    );


  if(!name){
    setMessage(
      "名前を入力してください",
      "error"
    );
    return;
  }


  const code =
    generateCode();


  const {data:room,error} =
    await db
      .from("rooms")
      .insert({
        code:code,
        player_count:count,
        status:"waiting",
        current_round:1
      })
      .select()
      .single();


  if(error){

    console.error(error);

    setMessage(
      "部屋を作れませんでした: "
      + error.message,
      "error"
    );

    return;
  }


  const {data:person,error:personError} =
    await db
      .from("participants")
      .insert({
        room_code:code,
        name:name,
        slot:1,
        locked:false
      })
      .select()
      .single();


  if(personError){

    setMessage(
      personError.message,
      "error"
    );

    return;
  }


  roomCode = code;
  myParticipant = person;
  isHost = true;

  enterRoom();

}


/* ==================================================
   JOIN
================================================== */

async function joinRoom(){

  const name =
    document.getElementById(
      "joinName"
    ).value.trim();

  const code =
    document.getElementById(
      "joinCode"
    ).value.trim().toUpperCase();


  if(!name || !code){

    setMessage(
      "名前とルームコードを入力してください",
      "error"
    );

    return;
  }


  const {data:room,error} =
    await db
      .from("rooms")
      .select("*")
      .eq("code",code)
      .maybeSingle();


  if(error || !room){

    setMessage(
      "その部屋が見つかりません",
      "error"
    );

    return;
  }


  if(room.status !== "waiting"){

    setMessage(
      "このドラフトはすでに開始されています",
      "error"
    );

    return;
  }


  const {data:existing} =
    await db
      .from("participants")
      .select("*")
      .eq("room_code",code)
      .order("slot");


  if(
    existing &&
    existing.length >= room.player_count
  ){

    setMessage(
      "この部屋は満員です",
      "error"
    );

    return;
  }


  const slot =
    (existing?.length || 0) + 1;


  const {data:person,error:personError} =
    await db
      .from("participants")
      .insert({
        room_code:code,
        name:name,
        slot:slot,
        locked:false
      })
      .select()
      .single();


  if(personError){

    setMessage(
      personError.message,
      "error"
    );

    return;
  }


  roomCode = code;
  myParticipant = person;

  enterRoom();

}


/* ==================================================
   ENTER ROOM
================================================== */

function enterRoom(){

  hide("home");
  show("room");

  document.getElementById(
    "roomCode"
  ).textContent = roomCode;


  if(poll){
    clearInterval(poll);
  }


  updateRoom();

  poll =
    setInterval(updateRoom,1000);

}


/* ==================================================
   ROOM UPDATE
================================================== */

async function updateRoom(){

  if(!roomCode || resolving) return;


  const {data:room} =
    await db
      .from("rooms")
      .select("*")
      .eq("code",roomCode)
      .maybeSingle();


  if(!room) return;


  roomData = room;


  if(room.status === "drafting"){

    clearInterval(poll);

    currentRound =
      room.current_round || 1;

    openDraft();

    return;
  }


  const {data:list} =
    await db
      .from("participants")
      .select("*")
      .eq("room_code",roomCode)
      .order("slot");


  participants =
    list || [];


  renderRoom();


  if(
    isHost &&
    participants.length === room.player_count
  ){

    show("startBtn");

    document.getElementById(
      "roomStatus"
    ).textContent =
      "Everyone is ready!";

  }

}


/* ==================================================
   ROOM UI
================================================== */

function renderRoom(){

  const box =
    document.getElementById(
      "roomPlayers"
    );

  box.innerHTML = "";


  participants.forEach(p => {

    box.innerHTML += `
      <div class="player-row">
        <span>
          ${p.slot}. ${escapeHTML(p.name)}
        </span>

        <span class="badge">
          ${p.locked ? "READY" : "WAITING"}
        </span>
      </div>
    `;

  });


  document.getElementById(
    "roomStatus"
  ).textContent =
    `${participants.length} / ${roomData.player_count} players`;

}


/* ==================================================
   START
================================================== */

async function startDraft(){

  if(!isHost) return;


  const {data:list} =
    await db
      .from("participants")
      .select("*")
      .eq("room_code",roomCode);


  if(
    !list ||
    list.length !== roomData.player_count
  ){

    alert(
      "まだ全員そろっていません"
    );

    return;
  }


  const {error} =
    await db
      .from("rooms")
      .update({
        status:"drafting",
        current_round:1
      })
      .eq("code",roomCode);


  if(error){

    alert(
      "スタートできません: "
      + error.message
    );

    console.error(error);

    return;
  }


  clearInterval(poll);

  openDraft();

}


/* ==================================================
   OPEN DRAFT
================================================== */

function openDraft(){

  hide("home");
  hide("room");
  show("draft");

  loadDraft();

  if(poll){
    clearInterval(poll);
  }

  poll =
    setInterval(loadDraft,1000);

}


/* ==================================================
   SNAKE ORDER
================================================== */

function getPickOrder(){

  const sorted =
    [...participants]
      .sort((a,b)=>a.slot-b.slot);


  if(currentRound % 2 === 0){
    sorted.reverse();
  }


  return sorted;

}


/* ==================================================
   DRAFT LOAD
================================================== */

async function loadDraft(){

  if(!roomCode || resolving) return;


  const {data:room} =
    await db
      .from("rooms")
      .select("*")
      .eq("code",roomCode)
      .maybeSingle();


  if(!room) return;


  roomData = room;

  currentRound =
    room.current_round || 1;


  const {data:list} =
    await db
      .from("participants")
      .select("*")
      .eq("room_code",roomCode)
      .order("slot");


  participants =
    list || [];


  document.getElementById(
    "roundNumber"
  ).textContent =
    `ROUND ${currentRound}`;


  const order =
    getPickOrder();


  const current =
    order.find(p => !p.locked);


  document.getElementById(
    "currentTurn"
  ).textContent =
    current
      ? current.name
      : "WAITING";


  const my =
    participants.find(
      p => p.id === myParticipant.id
    );


  if(my){

    myParticipant = my;


    document.getElementById(
      "lockBtn"
    ).disabled =
      my.locked;

    document.getElementById(
      "playerInput"
    ).disabled =
      my.locked;


    document.getElementById(
      "draftStatus"
    ).textContent =
      my.locked
        ? "🔒 Locked — waiting for everyone..."
        : "Choose a player and lock your pick.";

  }


  await renderDraftBoard();


  if(
    isHost &&
    participants.length > 0 &&
    participants.every(p=>p.locked)
  ){

    await resolveRound();

  }

}


/* ==================================================
   DRAFT BOARD
================================================== */

async function renderDraftBoard(){

  const {data:picks} =
    await db
      .from("picks")
      .select("*")
      .eq("room_code",roomCode)
      .eq("round",currentRound);


  const allLocked =
    participants.length > 0 &&
    participants.every(p=>p.locked);


  const box =
    document.getElementById(
      "draftBoard"
    );

  box.innerHTML = "";


  participants.forEach(p=>{

    const pick =
      (picks || []).find(
        x =>
          x.participant_id === p.id &&
          x.player_name
      );


    let text =
      "🔒 Locked";


    if(allLocked && pick){
      text =
        escapeHTML(pick.player_name);
    }


    box.innerHTML += `
      <div class="player-row">
        <span>
          ${p.slot}. ${escapeHTML(p.name)}
        </span>

        <span class="badge">
          ${text}
        </span>
      </div>
    `;

  });


  await renderHistory();

}


/* ==================================================
   LOCK PICK
================================================== */

async function lockPick(){

  if(myParticipant.locked){
    return;
  }


  const input =
    document.getElementById(
      "playerInput"
    );


  const player =
    input.value.trim();


  if(!player){

    alert(
      "選手名を入力してください"
    );

    return;
  }


  /*
    同じラウンドで同じ選手を
    選んでいる人がいるか確認。
    ただし全員同時公開なので、
    ここでは重複していてもOK。
    後でルーレットを行う。
  */


  const {data:oldPick} =
    await db
      .from("picks")
      .select("*")
      .eq("room_code",roomCode)
      .eq("participant_id",myParticipant.id)
      .eq("round",currentRound)
      .maybeSingle();


  let error;


  if(oldPick){

    const result =
      await db
        .from("picks")
        .update({
          player_name:player
        })
        .eq("id",oldPick.id);

    error =
      result.error;

  }else{

    const result =
      await db
        .from("picks")
        .insert({
          room_code:roomCode,
          player_name:player,
          participant_id:myParticipant.id,
          round:currentRound
        });

    error =
      result.error;

  }


  if(error){

    alert(
      "選手を保存できません: "
      + error.message
    );

    return;
  }


  const {error:lockError} =
    await db
      .from("participants")
      .update({
        locked:true
      })
      .eq("id",myParticipant.id);


  if(lockError){

    alert(
      "ロックできません: "
      + lockError.message
    );

    return;
  }


  myParticipant.locked = true;


  input.disabled = true;

  document.getElementById(
    "lockBtn"
  ).disabled = true;

  document.getElementById(
    "draftStatus"
  ).textContent =
    "🔒 Locked — waiting for everyone...";


  await loadDraft();

}


/* ==================================================
   RESOLVE ROUND
================================================== */

async function resolveRound(){

  if(resolving) return;

  resolving = true;


  const {data:picks} =
    await db
      .from("picks")
      .select("*")
      .eq("room_code",roomCode)
      .eq("round",currentRound);


  if(!picks){
    resolving = false;
    return;
  }


  /*
    参加者ごとのピック
  */

  const map = {};


  picks
    .filter(p=>p.player_name)
    .forEach(p=>{

      if(!map[p.player_name]){
        map[p.player_name] = [];
      }

      map[p.player_name].push(p);

    });


  const collisions =
    Object.entries(map)
      .filter(([_,group])=>group.length > 1);


  /*
    衝突なし
  */

  if(collisions.length === 0){

    await finishRound();

    resolving = false;

    return;
  }


  /*
    衝突あり
  */

  for(const [player,group] of collisions){

    /*
      ランダムで勝者を決定。
      同じ結果を全員に見せるため、
      hostがDBを書き換える。
    */

    const winnerIndex =
      Math.floor(
        Math.random() * group.length
      );

    const winner =
      group[winnerIndex];


    await showRoulette(
      player,
      group,
      winner
    );


    /*
      losers:
      player_nameを空にして
      locked=falseに戻す。
    */

    for(const pick of group){

      if(pick.id === winner.id){
        continue;
      }


      await db
        .from("picks")
        .update({
          player_name:""
        })
        .eq("id",pick.id);


      await db
        .from("participants")
        .update({
          locked:false
        })
        .eq("id",pick.participant_id);

    }

  }


  resolving = false;

  await loadDraft();

}


/* ==================================================
   ROULETTE
================================================== */

async function showRoulette(
  player,
  group,
  winner
){

  const overlay =
    document.getElementById(
      "rouletteOverlay"
    );

  const name =
    document.getElementById(
      "rouletteName"
    );


  overlay.classList.remove("hidden");


  const names =
    group.map(
      p =>
        participants.find(
          x=>x.id===p.participant_id
        )?.name || "Player"
    );


  for(let i=0;i<16;i++){

    name.textContent =
      names[i % names.length];

    await sleep(100);

  }


  const winnerName =
    participants.find(
      p=>p.id===winner.participant_id
    )?.name || "Winner";


  name.textContent =
    winnerName;


  await sleep(1000);


  overlay.classList.add("hidden");

}


function sleep(ms){

  return new Promise(
    resolve=>setTimeout(resolve,ms)
  );

}


/* ==================================================
   FINISH ROUND
================================================== */

async function finishRound(){

  /*
    全員のlockedをfalseにして、
    次のラウンドへ。
  */


  const nextRound =
    currentRound + 1;


  /*
    この例では各ラウンド3人分などではなく、
    ラウンド数を参加人数に合わせる。
    例:
    2人 -> 5 rounds
    3人 -> 5 rounds
  */

  const totalRounds = 5;


  if(currentRound >= totalRounds){

    await db
      .from("rooms")
      .update({
        status:"finished"
      })
      .eq("code",roomCode);


    showResults();

    return;
  }


  await db
    .from("participants")
    .update({
      locked:false
    })
    .eq("room_code",roomCode);


  await db
    .from("rooms")
    .update({
      current_round:nextRound
    })
    .eq("code",roomCode);


  currentRound =
    nextRound;


  document.getElementById(
    "playerInput"
  ).value = "";

}


/* ==================================================
   HISTORY
================================================== */

async function renderHistory(){

  const {data:picks} =
    await db
      .from("picks")
      .select("*")
      .eq("room_code",roomCode)
      .order("round")
      .order("created_at");


  const box =
    document.getElementById(
      "history"
    );


  if(!picks || picks.length===0){

    box.textContent =
      "No picks yet.";

    return;
  }


  box.innerHTML = "";


  picks
    .filter(p=>p.player_name)
    .forEach(p=>{

      const person =
        participants.find(
          x=>x.id===p.participant_id
        );


      box.innerHTML += `
        <div class="history-row">
          <strong>
            Round ${p.round}
          </strong>
          —
          ${escapeHTML(person?.name || "")}
          :
          ${escapeHTML(p.player_name)}
        </div>
      `;

    });

}


/* ==================================================
   RESULTS
================================================== */

async function showResults(){

  clearInterval(poll);

  hide("draft");

  show("resultsScreen");


  const {data:picks} =
    await db
      .from("picks")
      .select("*")
      .eq("room_code",roomCode)
      .order("round")
      .order("created_at");


  const box =
    document.getElementById(
      "results"
    );


  box.innerHTML = "";


  participants
    .sort((a,b)=>a.slot-b.slot)
    .forEach(person=>{

      const mine =
        (picks || [])
          .filter(
            p =>
              p.participant_id === person.id &&
              p.player_name
          );


      box.innerHTML += `
        <div class="result-card">

          <div class="result-name">
            ${person.slot}.
            ${escapeHTML(person.name)}
          </div>

          ${
            mine.length
              ? mine.map(
                  p =>
                    `<span class="pick">
                      R${p.round}
                      ${escapeHTML(p.player_name)}
                    </span>`
                ).join("")
              : `<span class="small">
                   No picks
                 </span>`
          }

        </div>
      `;

    });

}
