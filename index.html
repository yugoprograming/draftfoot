<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PLAYER DRAFT</title>

  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
      padding: 60px 20px;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    p {
      color: #aaa;
      margin-bottom: 40px;
    }

    button {
      display: block;
      width: 100%;
      padding: 18px;
      margin: 15px 0;
      border: none;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .create {
      background: white;
      color: black;
    }

    .join {
      background: #333;
      color: white;
    }

    #message {
      margin-top: 30px;
      font-size: 20px;
      color: #4ade80;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>PLAYER DRAFT</h1>

    <p>Premier League Player Draft</p>

    <button class="create" onclick="createDraft()">
      ドラフト会議を開催
    </button>

    <button class="join" onclick="joinDraft()">
      ドラフト会議に参加
    </button>

    <div id="message"></div>

  </div>

  <script>

    function createDraft() {
      document.getElementById("message").textContent =
        "ドラフト会議を開催します！";
    }

    function joinDraft() {
      document.getElementById("message").textContent =
        "ドラフト会議に参加します！";
    }

  </script>

</body>
</html>
